name: Build GKI Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Clean Runner & Free Space
        run: |
          sudo docker stop $(docker ps -a -q) 2>/dev/null || true
          sudo docker rm $(docker ps -a -q) 2>/dev/null || true
          sudo docker rmi $(docker images -q) 2>/dev/null || true
          sudo rm -rf /var/lib/docker /etc/docker
          sudo apt-get purge -y --auto-remove docker docker-engine docker.io containerd runc
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean

      - name: Setup Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl python3 bc bison flex libssl-dev zip tar cpio
          sudo curl -s https://storage.googleapis.com/git-repo-downloads/repo > /usr/local/bin/repo
          sudo chmod a+x /usr/local/bin/repo
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Source
        run: |
          mkdir gki-kernel
          cd gki-kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10-lts --depth=1
          repo sync -c -j$(nproc --all) --no-clone-bundle --no-tags

      - name: Build Kernel
        run: |
          cd gki-kernel
          BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh

      - name: Package AnyKernel3
        run: |
          SUBLEVEL=$(grep "^SUBLEVEL =" gki-kernel/common/Makefile | tr -d ' ' | cut -d= -f2)
          IMAGE_PATH=$(find gki-kernel/out -name Image -type f | head -n 1)

          if [ -z "$IMAGE_PATH" ]; then
            exit 1
          fi

          cp "$IMAGE_PATH" anykernel3/Image

          cd anykernel3
          ZIP_NAME="AK3-5.10.${SUBLEVEL}.zip"
          zip -r9 "../${ZIP_NAME}" * -x .git .gitignore README.md
          cd ..

          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "SUBLEVEL=${SUBLEVEL}" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          tag_name: 5.10.${{ env.SUBLEVEL }}
          name: GKI Kernel 5.10.${{ env.SUBLEVEL }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
