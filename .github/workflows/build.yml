name: Build GKI Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: debian:bookworm-slim
    permissions:
      contents: write

    steps:
      - name: Setup Debian Minimal & Repo CLI
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git \
            curl \
            python3 \
            ca-certificates \
            bc \
            bison \
            flex \
            libssl-dev \
            zip \
            tar \
            cpio \
            file \
            rsync \
            binutils
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > /usr/local/bin/repo
          chmod a+x /usr/local/bin/repo
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Kernel Source
        run: |
          mkdir gki-kernel
          cd gki-kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10-lts --depth=1
          repo sync -c -j$(nproc --all) --no-clone-bundle --no-tags

      - name: Build GKI Kernel
        run: |
          cd gki-kernel
          BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh

      - name: Package AnyKernel3
        run: |
          SUBLEVEL=$(grep "^SUBLEVEL =" gki-kernel/common/Makefile | tr -d ' ' | cut -d= -f2)
          IMAGE_PATH=$(find gki-kernel/out -name Image -type f | head -n 1)

          if [ -z "$IMAGE_PATH" ]; then
            echo "Build error: Image file not found"
            exit 1
          fi

          cp "$IMAGE_PATH" anykernel3/Image

          cd anykernel3
          ZIP_NAME="AK3-5.10.${SUBLEVEL}.zip"
          zip -r9 "../${ZIP_NAME}" * -x .git .gitignore README.md
          cd ..

          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "SUBLEVEL=${SUBLEVEL}" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          tag_name: 5.10.${{ env.SUBLEVEL }}
          name: GKI Kernel 5.10.${{ env.SUBLEVEL }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
