name: CI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        run: |
          git clone https://github.com/oppo-source/android_kernel_oppo_mt6765 -b oppo/mt6765_t_13.0.0 --depth 1 android_kernel

      - name: Checkout and Copy Kernel Modules
        run: |
          git clone https://github.com/oppo-source/android_kernel_modules_oppo_mt6765 -b oppo/mt6765_t_13.0.0 --depth 1 android_kernel_modules
          cp -r android_kernel_modules/vendor android_kernel/

      - name: Setup xxKSU
        run: |
          cd android_kernel
          curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh" | bash
          echo "CONFIG_KSU=y" >> arch/arm64/configs/k65v1_64_bsp_defconfig

      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: android_kernel/
          config: k65v1_64_bsp_defconfig
          arch: arm64
          aosp-gcc: true
          ccache: true
          aosp-clang: true
          android-version: 11
          aosp-clang-version: r383902
          anykernel3: true
          release: true
          access-token: ${{ secrets.GITHUB_TOKEN }}
