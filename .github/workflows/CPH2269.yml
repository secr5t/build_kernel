name: CI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        run: |
          git clone --depth=1 https://github.com/oppo-source/android_kernel_oppo_mt6765 -b oppo/mt6765_r_11.1.4_a16 android_kernel

      - name: Checkout Vendor Source
        run: |
          git clone --depth=1 https://github.com/oppo-source/android_kernel_modules_oppo_mt6765 -b oppo/mt6765_r_11.1.4_a16 android_kernel/vendor

      - name: Fix Vendor Symlinks
        run: |
          cd android_kernel
          cat << 'EOF' > fix_symlinks.py
          import os
          import shutil

          for root, dirs, files in os.walk("."):
              for name in files + dirs:
                  filepath = os.path.join(root, name)
                  target_path = None
                  
                  if os.path.islink(filepath):
                      try:
                          target_path = os.readlink(filepath)
                      except Exception:
                          pass
                  elif os.path.isfile(filepath):
                      try:
                          if os.path.getsize(filepath) < 300:
                              with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                                  content = f.read().strip()
                                  if "vendor/" in content:
                                      target_path = content
                      except Exception:
                          pass

                  if target_path and "vendor/" in target_path:
                      resolved = os.path.normpath(os.path.join(root, target_path))
                      if os.path.exists(resolved):
                          if os.path.islink(filepath) or os.path.isfile(filepath):
                              os.remove(filepath)
                          elif os.path.isdir(filepath):
                              shutil.rmtree(filepath)
                          
                          if os.path.isdir(resolved):
                              shutil.copytree(resolved, filepath)
                          elif os.path.isfile(resolved):
                              shutil.copy2(resolved, filepath)
          EOF
          python3 fix_symlinks.py
          rm fix_symlinks.py

      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: android_kernel/
          config: oppo6765_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          android-version: 11
          aosp-clang-version: r383902
          vendor: true
          vendor-url: https://github.com/oppo-source/android_kernel_modules_oppo_mt6765
          vendor-branch: oppo/mt6765_r_11.1.4_a16
          vendor-dir: vendor
          access-token: ${{ secrets.GITHUB_TOKEN }}
