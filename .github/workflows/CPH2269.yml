name: CI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        run: |
          git clone --depth=1 https://github.com/oppo-source/android_kernel_oppo_mt6765 -b oppo/mt6765_r_11.1.4_a16 android_kernel

      - name: Patch Kconfig
        run: |
          cd android_kernel
          cat << 'EOF' > fix_kconfig.py
          import os
          import re

          for root, _, files in os.walk("."):
              for file in files:
                  if "Kconfig" in file or file.endswith(".kconfig"):
                      filepath = os.path.join(root, file)
                      try:
                          with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                              lines = f.readlines()
                          
                          new_lines = []
                          modified = False
                          for line in lines:
                              m = re.match(r"^(\s*)source\s+[\"']?([^\"'\s]+)[\"']?(.*)$", line)
                              if m:
                                  leading_space = m.group(1)
                                  target_path = m.group(2)
                                  
                                  p1 = target_path
                                  p2 = os.path.join(root, target_path)
                                  
                                  if not os.path.isfile(p1) and not os.path.isfile(p2):
                                      line = f"{leading_space}# {line.strip()}\n"
                                      modified = True
                              new_lines.append(line)
                          
                          if modified:
                              with open(filepath, "w", encoding="utf-8") as f:
                                  f.writelines(new_lines)
                      except Exception:
                          pass
          EOF
          python3 fix_kconfig.py
          rm fix_kconfig.py

      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: android_kernel/
          config: oppo6765_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          android-version: 11
          aosp-clang-version: r383902
          vendor: true
          vendor-url: https://github.com/oppo-source/android_kernel_modules_oppo_mt6765
          vendor-branch: oppo/mt6765_r_11.1.4_a16
          vendor-dir: vendor
          access-token: ${{ secrets.GITHUB_TOKEN }}
