name: CI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        run: |
          git clone --depth=1 https://github.com/secr5t/android_kernel_CPH2269 -b main android_kernel
          
      - name: Setup xxKSU
        run: |
          cd android_kernel
          curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh" | bash
          echo "CONFIG_KSU=y" >> arch/arm64/configs/oppo6765_defconfig

      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: android_kernel/
          config: oppo6765_defconfig
          arch: arm64
          aosp-gcc: true
          ccache: true
          aosp-clang: true
          android-version: 11
          aosp-clang-version: r383902
          access-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy Kernel Image to AnyKernel
        run: |
          mkdir -p $GITHUB_WORKSPACE/CPH2269_anykernel
          IMAGE_PATH=$(find android_kernel -type f -name "Image" -print -quit)
          if [ -f "$IMAGE_PATH" ]; then
            echo "Kernel image: $IMAGE_PATH"
            cp -v "$IMAGE_PATH" $GITHUB_WORKSPACE/CPH2269_anykernel/
          else
            echo "Cant find kernel image"
            exit 1
          fi

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CPH2269-Kernel
          path: CPH2269_anykernel/
          compression-level: 9
