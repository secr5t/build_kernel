name: CI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        run: |
          git clone --depth=1 https://github.com/secr5t/android_kernel_CPH2269 -b main android_kernel
          
      - name: Setup xxKSU
        run: |
          cd android_kernel
          curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh" | bash
          echo "CONFIG_KSU=y" >> arch/arm64/configs/oppo6765_defconfig

      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: android_kernel/
          config: oppo6765_defconfig
          arch: arm64
          aosp-gcc: true
          ccache: true
          aosp-clang: true
          android-version: 11
          aosp-clang-version: r383902
          anykernel3: true
          release: true
          access-token: ${{ secrets.GITHUB_TOKEN }}