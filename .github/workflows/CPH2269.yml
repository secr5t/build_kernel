name: CI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        run: |
          git clone --depth=1 https://github.com/oppo-source/android_kernel_oppo_mt6765 -b oppo/mt6765_r_11.1.4_a16 android_kernel

      - name: Patch Kconfig
        run: |
          cd android_kernel
          cat << 'EOF' > patch_kconfig.py
          import os, re

          for root, _, files in os.walk("."):
              for file in files:
                  if file.startswith("Kconfig"):
                      filepath = os.path.join(root, file)
                      with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                          lines = f.readlines()
                      
                      new_lines = []
                      changed = False
                      for line in lines:
                          match = re.match(r"^\s*source\s+[\"']?([^\"'\s]+)[\"']?", line)
                          if match:
                              target = match.group(1)
                              if not os.path.exists(target) and not os.path.exists(os.path.join(root, target)):
                                  line = "# " + line
                                  changed = True
                          new_lines.append(line)
                      
                      if changed:
                          with open(filepath, "w", encoding="utf-8") as f:
                              f.writelines(new_lines)
          EOF
          python3 patch_kconfig.py
          rm patch_kconfig.py

      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: android_kernel/
          config: oppo6765_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          android-version: 11
          aosp-clang-version: r383902
          vendor: true
          vendor-url: https://github.com/oppo-source/android_kernel_modules_oppo_mt6765
          vendor-branch: oppo/mt6765_r_11.1.4_a16
          vendor-dir: vendor
          access-token: ${{ secrets.GITHUB_TOKEN }}
