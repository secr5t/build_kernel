name: CI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        run: |
          git clone --depth=1 https://github.com/oppo-source/android_kernel_oppo_mt6765 -b oppo/mt6765_r_11.1.4_a16 android_kernel

      - name: Patch Kconfig
        run: |
          cd android_kernel
          python3 -c '
          import os, re

          for root, _, files in os.walk("."):
              for file in files:
                  if "Kconfig" in file or file.endswith(".kconfig"):
                      filepath = os.path.join(root, file)
                      try:
                          with open(filepath, "rb") as f:
                              content = f.read().replace(b"\r\n", b"\n").replace(b"\r", b"\n")
                          lines = content.decode("utf-8", errors="ignore").splitlines(True)
                          new_lines = []
                          for line in lines:
                              match = re.match(r"^\s*source\s+[\"'\']?([^\"'\s]+)[\"'\']?", line)
                              if match:
                                  target = match.group(1)
                                  if not target.startswith("$") and not os.path.exists(target):
                                      line = "# " + line
                              new_lines.append(line)
                          with open(filepath, "wb") as f:
                              f.write("".join(new_lines).encode("utf-8"))
                      except Exception:
                          pass
          '

      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: android_kernel/
          config: oppo6765_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          android-version: 11
          aosp-clang-version: r383902
          vendor: true
          vendor-url: https://github.com/oppo-source/android_kernel_modules_oppo_mt6765
          vendor-branch: oppo/mt6765_r_11.1.4_a16
          vendor-dir: vendor
          access-token: ${{ secrets.GITHUB_TOKEN }}
