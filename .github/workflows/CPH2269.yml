name: CI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Vendor Modules
        run: |
          git clone --depth=1 https://github.com/oppo-source/android_kernel_modules_oppo_mt6765 -b oppo/mt6765_r_11.1.4_a16 vendor || git clone --depth=1 https://github.com/oppo-source/android_kernel_modules_oppo_mt6765 vendor

      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/oppo-source/android_kernel_oppo_mt6765
          kernel-branch: oppo/mt6765_r_11.1.4_a16
          config: oppo6765_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          android-version: 11
          aosp-clang-version: r383902
          access-token: ${{ secrets.GITHUB_TOKEN }}
